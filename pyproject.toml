[project]
name = "finadvisor"
version = "0.1.0"
description = "Gemini investing-education assistant with a market-data MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
